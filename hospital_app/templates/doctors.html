{% extends 'base.html' %}

{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/index.css' %}">
{% endblock %}

{% block content %}

<style>
    .doctor-img {
    width: 100%;
    height: 300px;
    object-fit: cover;
}
</style>

<div class="container py-5">
    <h1 class="text-center text-white mb-5">
        Our Doctors
    </h1>

    <div class="row g-4">

        {% for d in doc %}

        <div class="col-md-6 col-lg-4">
            <div class="card doctor-card border-0 shadow-lg h-100">

                <img src="{{ d.doc_image.url }}"
                     class="card-img-top doctor-img"
                     alt="{{ d.doc_name }}">

                <div class="card-body text-center">

                    <h4 class="fw-bold">
                        Dr. {{ d.doc_name }}
                    </h4>

                    <span class="badge bg-primary mb-3">
                        {{ d.doc_spec }}
                    </span>

                    <p class="text-muted">
                        {{ d.dp_name }}
                    </p>

                </div>
            </div>
        </div>

        {% endfor %}

    </div>
</div>

{% endblock %}
